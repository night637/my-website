
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Menu - Burger Station</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🍔 BURGER STATION</h1>
        <p>Fresh burgers. Big taste.</p>
    </header>

    <nav>
        <h2>Explore</h2>

        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="Special.html">Special</a>
        <a href="layout.html">Layout</a>
    </nav>

    <main>
    <img src="burger.jpg" alt="Burger" style="width: 500px;">
        
        
        <h1>Our Menu</h1>

        <ul>
            <li>Cheeseburger - Cheddar Sauce</li>
            <li>Double Burger - Chili Sauce</li>
            <li>Chicken Burger - Garlic Sauce</li>
            <li>Bacon Burger - BBQ Sauce</li>
        </ul>

        <button
            type="button"
            class="burger-button"
            onclick="toggleBurger()">
            Show Burger 🍔
        </button>

        <br><br>

        <img
            id="burgerGif"
            src="juliush-hamburger-260.gif"
            alt="Animated hamburger"
            style="display: none; width: 260px;">

    </main>

    <script>
        function toggleBurger() {
            const burger = document.getElementById("burgerGif");
            const button = document.querySelector(".burger-button");

            if (burger.style.display === "none") {
                burger.style.display = "block";
                button.textContent = "Hide Burger 🍔";
            } else {
                burger.style.display = "none";
                button.textContent = "Show Burger 🍔";
            }
        }
    </script>

    <footer>
        <p>BURGER STATION 2026</p>
    </footer>

</body>

</html>
